[main]
font=Inconsolata Nerd Font:size=16
exit-on-keyboard-focus-loss=no
icon-theme=Papirus
icons-enabled=yes
width=35
lines=12
horizontal-pad=12
vertical-pad=8
inner-pad=4

[colors]
# Nord palette. Selection is a raised nord2 row; nord8 marks the match.
background=2e3440e6
text=d8dee9ff
match=88c0d0ff
selection=434c5eff
selection-text=d8dee9ff
selection-match=88c0d0ff
border=4c566aff

[border]
width=1
radius=0

[key-bindings]
delete-line-forward=none
prev=Up Control+p Control+k
next=Down Control+n Control+j
