[main]
font=JetBrainsMono Nerd Font:size=16
icon-theme=Papirus
icons-enabled=yes
width=35
lines=12
horizontal-pad=12
vertical-pad=8
inner-pad=4

[colors]
# Nord palette
# bg: nord0 rgba(46,52,64,0.90) = #2e3440e6
background=2e3440e6
text=d8dee9ff
match=88c0d0ff
selection=8fbcbbff
selection-text=2e3440ff
selection-match=2e3440ff
border=5e81acff

[border]
width=1
radius=0

[key-bindings]
delete-line-forward=none
prev=Up Control+p Control+k
next=Down Control+n Control+j
