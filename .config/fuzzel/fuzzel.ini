[main]
font=Inconsolata Nerd Font:size=20
exit-on-keyboard-focus-loss=no
icon-theme=Papirus
icons-enabled=yes
width=35
lines=12
horizontal-pad=12
vertical-pad=8
inner-pad=4

[colors]
# Nord palette
# bg: nord0 rgba(46,52,64,0.90) = #2e3440e6
background=2e3440e6
text=d8dee9ff
input=d8dee9ff
message=d8dee9ff
prompt=81a1c1ff
placeholder=81a1c1ff
counter=81a1c1ff
match=88c0d0ff
# Alpha stacks on the bg's own e6; near-ff is a solid slab. Composites to nord2.
selection=4c566a8e
selection-text=d8dee9ff
selection-match=88c0d0ff
border=5e81acff

[border]
width=1
radius=0

[key-bindings]
delete-line-forward=none
prev=Up Control+p Control+k
next=Down Control+n Control+j
