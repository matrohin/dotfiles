[main]
font=Inconsolata Nerd Font:size=16
exit-on-keyboard-focus-loss=no
icon-theme=Papirus
icons-enabled=yes
width=35
lines=12
horizontal-pad=12
vertical-pad=8
inner-pad=4

[colors]
# Nord palette. Selection is a solid nord12 row; nord13 marks the match.
background=2e3440e6
text=d8dee9ff
# text= covers list entries only; the input line needs its own colors
input=d8dee9ff
message=d8dee9ff
prompt=d08770ff
placeholder=4c566aff
counter=616e88ff
match=ebcb8bff
selection=d08770ff
selection-text=2e3440ff
selection-match=2e3440ff
border=d08770ff

[border]
width=1
radius=0

[key-bindings]
delete-line-forward=none
prev=Up Control+p Control+k
next=Down Control+n Control+j
