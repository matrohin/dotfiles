set-option -g prefix M-a
set-option -g prefix C-a
unbind-key M-a
bind-key M-a send-prefix

set -g mouse on
set -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
# Copy via OSC 52 (see terminal-features below)
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

bind-key v split-window -h -c '#{pane_current_path}'
bind-key h split-window -v -c '#{pane_current_path}'
bind-key c new-window -c '#{pane_current_path}'

bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

set -sg escape-time 10

set -g default-terminal "tmux-256color"
# Truecolor, styled underlines (undercurl), OSC 52 clipboard
set -as terminal-features ",*:RGB:usstyle:clipboard"

set -g status-justify "centre"
set -g status-position "top"

# Bar blends into the terminal background; flat foreground-only styling
set-option -g status-style "bg=default,fg=#d8dee9"
set-window-option -g window-status-separator "  "

set-window-option -g window-status-format "#[fg=#616e88]#I|#W"
set-window-option -g window-status-current-format "#[fg=#d08770]#I|#W"

set-option -g pane-border-style fg="#4c566a"
set-option -g pane-active-border-style fg="#d08770"

set -g status-left ""
set -g status-right "#[fg=#ebcb8b]%H:%M %d-%b-%y"

set-option -g focus-events on
