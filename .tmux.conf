set-option -g prefix M-a
set-option -g prefix C-a
unbind-key M-a
bind-key M-a send-prefix

set -g mouse on
set -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
# Copy via OSC 52 (see terminal-features below)
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

bind-key v split-window -h -c '#{pane_current_path}'
bind-key h split-window -v -c '#{pane_current_path}'
bind-key c new-window -c '#{pane_current_path}'

bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

set -sg escape-time 10

set -g default-terminal "tmux-256color"
# Truecolor, styled underlines (undercurl), OSC 52 clipboard
set -as terminal-features ",*:RGB:usstyle:clipboard"

set -g status-justify "centre"
set -g status-position "top"

# Centre-screen, so foreground-only — no fills or bold, unlike waybar/sway
set-option -g status-style "bg=default,fg=#d8dee9"
set-window-option -g window-status-separator "  "

set-window-option -g window-status-format "#[fg=#81a1c1]#I|#W"
set-window-option -g window-status-current-format "#[fg=#d8dee9]#I|#W"

set-option -g pane-border-style fg="#4c566a"
set-option -g pane-active-border-style fg="#88c0d0"

# bg-only, so selected text keeps its colors
set-window-option -g mode-style "bg=#434c5e"
set-window-option -g copy-mode-position-style "bg=#434c5e,fg=#d8dee9"
set-window-option -g copy-mode-match-style "bg=#88c0d0,fg=#2e3440"
set-window-option -g copy-mode-current-match-style "bg=#8fbcbb,fg=#2e3440"
set-window-option -g copy-mode-mark-style "bg=#bf616a,fg=#2e3440"

set-option -g message-style "bg=#3b4252,fg=#eceff4"
set-option -g message-command-style "bg=#3b4252,fg=#88c0d0"

set-window-option -g window-status-activity-style "fg=#ebcb8b"
set-window-option -g window-status-bell-style "fg=#bf616a"

set-window-option -g clock-mode-colour "#88c0d0"

set -g status-left ""
set -g status-right "#[fg=#81a1c1]%H:%M %d-%b-%y"

set-option -g focus-events on
